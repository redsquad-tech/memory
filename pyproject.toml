[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "assocmem"
version = "0.2.0"
description = "Online predictive associative memory with local supervised updates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3"]

[project.optional-dependencies]
experiments = ["numpy>=1.26", "scikit-learn>=1.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
assocmem-exp = "assocmem.experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
